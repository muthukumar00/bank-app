spring.application.name=bank

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/bankapp
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

#kafka
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=bank-transaction-group
spring.kafka.consumer.auto-offset-reset=earliest


jwt.secret=ThisIsASecretKeyForBankApplicationJwtTokenGeneration123456
jwt.expiration=3600000

spring.data.redis.host=localhost
spring.data.redis.port=6379